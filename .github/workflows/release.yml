name: Release

# 通过 Trusted Publishing (OIDC) 发布到 npmjs.com。
#
# 这条链路不需要任何 Secret：
#   - GitHub Actions 每次运行时签发一个短期 OIDC token
#   - npm 校验该 token 是否匹配包的 trusted publisher 配置（仓库 + workflow 文件名）
#   - 校验通过即允许 npm publish，无需 NPM_TOKEN，也无需 OTP
#
# 一次性配置（在 npmjs.com 网页上完成，需要账号已启用 2FA）：
#   包页面 → Settings → Trusted publishing → Add a trusted publisher
#     Provider   : GitHub Actions
#     Repository : superjunjie/pdf-h5-react
#     Workflow   : release.yml
#     Environment: (留空)
#   或等价的 CLI：npm trust github pdf-h5-react --file release.yml --repo superjunjie/pdf-h5-react --allow-publish -y
#
# 触发方式：
#   1) 推送形如 v0.3.1 的 tag —— 版本号必须与 package.json 一致，CI 会校验
#   2) 在 Actions 页面手动 Run workflow（可用输入框覆盖版本号）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖 package.json 的版本号（留空则用 package.json 里的版本）'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish (OIDC)
    runs-on: ubuntu-latest
    permissions:
      # contents: write 仅用于把发布日志推到 ci-debug 分支便于排查
      contents: write
      # 关键：id-token: write 让 Actions 能签发 OIDC token，npm 靠它做身份校验
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # 关键：这里**不能**设 registry-url。
      #
      # setup-node 的 registry-url 会在 ~/.npmrc 写一行
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 未提供 token 时它展开成空字符串，但 npm 只要看到 _authToken 这一行存在，
      # 就认为「认证已配置」，于是跳过 OIDC 交换，导致 trusted publishing 静默失效
      # （表现为 ENEEDAUTH 或 404 Not Found - PUT）。
      # registry.npmjs.org 本就是默认源，所以这个参数没有收益，只有风险。
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # 兜底：清掉可能存在的 _authToken 行，确保 npm 会走 OIDC 交换
      - name: Strip auth token from npmrc (force OIDC path)
        run: |
          for f in "$HOME/.npmrc" "$(pwd)/.npmrc"; do
            if [ -f "$f" ] && grep -q '_authToken' "$f"; then
              echo "清理 $f 中的 _authToken 行"
              grep -v '_authToken' "$f" > "$f.tmp" || true
              mv "$f.tmp" "$f"
            fi
          done
          echo "--- 当前 .npmrc（预期无 _authToken）---"
          cat "$HOME/.npmrc" 2>/dev/null || echo "(empty)"

      # 兜底校验：npm 版本必须 >= 11.5.1，否则 OIDC 发布不可用，提前失败给出清晰原因
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm: $NPM_VERSION / node: $(node --version)"
          MAJOR="$(echo "$NPM_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$NPM_VERSION" | cut -d. -f2)"
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "::error::npm $NPM_VERSION 不支持 trusted publishing（需要 >= 11.5.1）"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION / tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ($TAG_VERSION) 与 package.json ($PKG_VERSION) 不一致，请先同步版本号"
            exit 1
          fi

      - name: Apply version override (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Check dist artifacts
        run: |
          for f in dist/index.js dist/index.d.ts dist/pdf-h5-react.css; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少构建产物 $f"
              exit 1
            fi
            echo "✓ $f ($(du -h "$f" | cut -f1))"
          done

      # 使用 OIDC 时不要设置 NODE_AUTH_TOKEN：一旦存在 token，npm 会走 token 认证
      # 而不是 trusted publishing，反而可能因权限不足失败。
      #
      # 注意 --provenance 与 --access public：前者让 npm 附加来源证明（OIDC 场景会自动启用），
      # 后者确保首次发布会创建公开包。明确写出来，避免依赖隐式行为。
      - name: Publish to npmjs (trusted publishing)
        run: |
          set -o pipefail
          echo "=== 发布前诊断 ==="
          echo "npm: $(npm --version) / node: $(node --version)"
          echo "package: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "--- npmrc（预期无 _authToken）---"
          cat "$HOME/.npmrc" 2>/dev/null || echo "(none)"
          echo "--- OIDC 环境变量（只看是否存在）---"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "REQUEST_URL: present"; else echo "REQUEST_URL: MISSING"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "REQUEST_TOKEN: present"; else echo "REQUEST_TOKEN: MISSING"; fi
          echo "--- 该版本是否已存在 ---"
          curl -s -o /dev/null -w 'registry 上 %{http_code}\n' "https://registry.npmjs.org/$(node -p "require('./package.json').name")/$(node -p "require('./package.json').version")"
          echo "=================================="

          # 把完整输出写到文件，并在失败时上传为 artifact（页面日志拿不到时的兜底）
          set +e
          npm publish --registry=https://registry.npmjs.org --access public > /tmp/npm-publish.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/npm-publish.log
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "### npm publish 失败（退出码 $STATUS）"
              echo ""
              echo '```'
              tail -60 /tmp/npm-publish.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      # 失败兜底：让日志成为可下载 artifact，方便排查（也便于无仓库权限时取证）
      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-log
          path: /tmp/npm-publish.log
          if-no-files-found: ignore
          retention-days: 7

      # 把发布日志推到 ci-debug 分支：运行日志需要鉴权才能看，
      # 而分支可以公开读取，便于在没有仓库凭据的情况下排查「发了但没上线」。
      - name: Publish log to ci-debug branch
        if: always()
        run: |
          if [ ! -f /tmp/npm-publish.log ]; then
            echo "没有日志文件，跳过"
            exit 0
          fi
          # commit-tree 需要作者身份；checkout 默认不配置
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "run: $GITHUB_RUN_ID"
            echo "ref: $GITHUB_REF"
            echo "sha: $GITHUB_SHA"
            echo "npm: $(npm --version) / node: $(node --version)"
            echo "version: $(node -p "require('./package.json').version")"
            echo "----- npm config -----"
            npm config list 2>&1 | grep -v '_authToken' || true
            echo "----- npm publish output -----"
            cat /tmp/npm-publish.log
          } > /tmp/ci-debug.log
          BLOB="$(git hash-object -w /tmp/ci-debug.log)"
          TREE="$(printf '100644 blob %s\tnpm-publish.log\n' "$BLOB" | git mktree)"
          COMMIT="$(git commit-tree "$TREE" -m "ci publish log $GITHUB_RUN_ID")"
          git push -f origin "$COMMIT:refs/heads/ci-debug"

      # 发布后校验：确认 registry 上真的存在这个版本，避免「命令成功但没发出去」
      - name: Verify published to registry
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "校验 https://registry.npmjs.org/pdf-h5-react/$VERSION"
          for i in $(seq 1 12); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://registry.npmjs.org/pdf-h5-react/$VERSION")"
            echo "  尝试 $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✓ registry 上已存在 $VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::发布命令执行成功，但 registry 上查不到 $VERSION —— 请检查 npm 输出"
          exit 1

      - name: Summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### 已发布到 npmjs（OIDC 信任发布）"
            echo ""
            echo '```'
            echo "pdf-h5-react@$VERSION"
            echo '```'
            echo ""
            echo "安装：\`npm i pdf-h5-react@$VERSION\`"
            echo ""
            echo "https://www.npmjs.com/package/pdf-h5-react/v/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
